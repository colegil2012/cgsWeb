spring:
  application:
    name: cgsWeb
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cgsweb}
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:cole@celtechgs.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_HOST:smtp.office365.com}
          timeout: 15000
          connectiontimeout: 10000
          writetimeout: 15000
app:
  upload:
    path: ${IMAGE_UPLOAD_PATH:external-images/}
  tax:
    rate: ${TAX_RATE:0.07}
  security:
    bcrypt:
      strength: ${BCRYPT_STRENGTH:12}
    remember-me:
      key: ${REMEMBER_ME_KEY:cgsweb-dev-remember-me-key}
      validity-seconds: ${REMEMBER_ME_VALIDITY:1209600}
    guest-cart:
      cookie-name: cgs_guest_id
      max-age-days: 30
  spaces:
    bucket: ${SPACES_BUCKET:cgsweb-img}
    region: ${SPACES_REGION:nyc3}
    endpoint: ${SPACES_ENDPOINT:https://nyc3.digitaloceanspaces.com}
    access-key: ${SPACES_ACCESS_KEY:}
    secret-key: ${SPACES_SECRET_KEY:}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:support@celtechgs.com}
    from-name: ${MAIL_FROM_NAME:Celtech General Store}
    reply-to: ${MAIL_REPLY_TO:cole@celtechgs.com}
    public-base-url: ${MAIL_PUBLIC_BASE_URL:http://localhost:8080}

celtech:
  driver:
    token: ${CELTECH_DRIVER_TOKEN:}
  route:
    optimizer: ors
    home-base:
      latitude: ${ROUTE_HOME_BASE_LAT:38.00317456212482}
      longitude: ${ROUTE_HOME_BASE_LNG:-85.71534984109215}
    ors:
      apiKey: ${ORS_API_KEY:}
      baseUrl: ${ORS_BASE_URL:https://api.openrouteservice.org}
      profile: ${ORS_PROFILE:driving-car}
      timeoutSeconds: ${ORS_TIMEOUT_SECONDS:30}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

service-area:
  origin-lat: ${SVC_AREA_LAT:38.00317456212482}
  origin-lng: ${SVC_AREA_LONG:-85.71534984109215}
  radius-miles: ${SVC_AREA_RADIUS:50}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.cgs.web: DEBUG
    org.springframework.security: DEBUG
    com.ua.estore.cgsWeb.security: DEBUG