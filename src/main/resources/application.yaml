spring:
  application:
    name: cgsWeb
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cgsweb}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  upload:
    path: ${IMAGE_UPLOAD_PATH:external-images/}
  security:
    bcrypt:
      strength: ${BCRYPT_STRENGTH:12}
    remember-me:
      key: ${REMEMBER_ME_KEY:cgsweb-dev-remember-me-key}
      validity-seconds: ${REMEMBER_ME_VALIDITY:1209600}
    guest-cart:
      cookie-name: cgs_guest_id
      max-age-days: 30
  spaces:
    bucket: ${SPACES_BUCKET:cgsweb-img}
    region: ${SPACES_REGION:nyc3}
    endpoint: ${SPACES_ENDPOINT:https://nyc3.digitaloceanspaces.com}
    access-key: ${SPACES_ACCESS_KEY:}
    secret-key: ${SPACES_SECRET_KEY:}

square:
  environment: sandbox
  sandbox:
    access-token: ${SQUARE_ACCESS_TOKEN:}
  application-id: ${SQUARE_APPLICATION_ID:}
  location-id: ${SQUARE_LOCATION_ID:}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

service-area:
  origin-lat: ${SVC_AREA_LAT:38.00317456212482}
  origin-lng: ${SVC_AREA_LONG:-85.71534984109215}
  radius-miles: ${SVC_AREA_RADIUS:50}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.cgs.web: DEBUG
    org.springframework.security: DEBUG
    com.ua.estore.cgsWeb.security: DEBUG